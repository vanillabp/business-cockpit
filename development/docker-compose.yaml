version: '3'

services:
  business-cockpit-mongo:
    # 4.4 has been out of support since February 2024 and the 5.8 driver only barely still speaks
    # to it. 8.0 is the current LTS. The jump crosses four server majors, so the replica set
    # initialisation and the user setup in ./mongo/ were re-verified against it.
    image: mongo:8.0
    container_name: business-cockpit-mongo
    restart: "no"
    ports:
      - "27017:27017"
    entrypoint: [ "/usr/bin/mongod", "--replSet", "rs-business-cockpit", "--bind_ip_all" ]
  business-cockpit-mongo-setup:
    image: business-cockpit-mongo-setup
    build: ./mongo/
    container_name: business-cockpit-mongo-setup
    restart: "no"
    depends_on:
      - business-cockpit-mongo
    volumes:
       - "./mongo:/config"
  verdaccio:
    build: ./verdaccio/
    container_name: 'verdaccio'
    restart: "no"
    environment:
      - VERDACCIO_PORT=4873
    ports:
      - '4873:4873'
    volumes:
      - ./verdaccio/conf:/verdaccio/conf

