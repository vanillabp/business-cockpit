syntax = 'proto3';

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "io.vanillabp.cockpit.bpms.api.protobuf.v1";

message DetailsValue {
  oneof These {
    bool nullValue = 1;
    string numericValue = 2;
    string stringValue = 3;
    bool boolValue = 4;
    DetailsMap mapValue = 5;
  }
}

message DetailsMap {
  map<string, DetailsArrayValue> details = 1;
}

message DetailsArrayValue {
  bool isArray = 1;
  repeated DetailsValue arrayValues = 2;
}

message Details {
  map<string, DetailsArrayValue> details = 1;
}

message GroupHierarchy {
  string group = 1;
  repeated string target = 2;
}

message BcEvent {
  oneof event {
    UserTaskCreatedOrUpdatedEvent userTaskCreatedOrUpdated = 1;
    UserTaskCompletedEvent userTaskCompleted = 2;
    UserTaskCancelledEvent userTaskCancelled = 3;
    UserTaskSuspendedEvent userTaskSuspended = 4;
    UserTaskActivatedEvent userTaskActivated = 5;
    WorkflowCreatedOrUpdatedEvent workflowCreatedOrUpdated = 6;
    WorkflowCompletedEvent workflowCompleted = 7;
    WorkflowCancelledEvent workflowCancelled = 8;
    RegisterWorkflowModuleEvent registerWorkflowModule = 9;
    UserTaskCreatedOrUpdatedEvent userTaskCreatedV1_1 = 10;
    UserTaskCreatedOrUpdatedEvent userTaskUpdatedV1_1 = 11;
    UserTaskCreatedOrUpdatedEvent userTaskCompletedV1_1 = 12;
    UserTaskCreatedOrUpdatedEvent userTaskCancelledV1_1 = 13;
    WorkflowCreatedOrUpdatedEvent workflowCreatedV1_1 = 14;
    WorkflowCreatedOrUpdatedEvent workflowUpdatedV1_1 = 15;
    WorkflowCreatedOrUpdatedEvent workflowCompletedV1_1 = 16;
    WorkflowCreatedOrUpdatedEvent workflowCancelledV1_1 = 17;
  }
}

message UserTaskCreatedOrUpdatedEvent {
  string id = 1;
  string api_version = 2;
  string user_task_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  string bpmn_process_id = 5;
  string task_definition = 6;
  map<string, string> title = 7;
  string workflow_module_id = 8;
  string ui_uri_path = 10;
  string ui_uri_type = 11;
  optional bool updated = 12;
  optional string initiator = 13;
  optional string source = 14;
  optional string comment = 16;
  optional string bpmn_process_version = 17;
  map<string, string> workflow_title = 18;
  optional string workflow_id = 19;
  optional string sub_workflow_id = 20;
  optional string business_id = 21;
  optional string bpmn_task_id = 22;
  map<string, string> task_definition_title = 23;
  // who sees the task: the assignee, the candidate users, the candidate groups and the excluded
  // candidate users. They are read only from the report which creates the user task in the
  // cockpit. That is usually the creation, but an update or an end which arrives first creates the
  // task as well. Later reports do not change who sees the task. Only the cockpit itself changes
  // the assignee and the candidate users, when somebody claims the task or assigns it to somebody
  optional string assignee = 25;
  repeated string candidate_users = 26;
  repeated string candidate_groups = 27;
  optional google.protobuf.Timestamp due_date = 28;
  optional google.protobuf.Timestamp follow_up_date = 29;
  optional DetailsMap details = 30;
  optional string details_fulltext_search = 31;
  // see assignee: read only from the report which creates the user task
  repeated string excluded_candidate_users = 32;
  optional NotificationDelivery notification_delivery = 33;
  // users who may see the task although they are no candidate for it. Unlike the assignee and
  // the candidates, this list is read from every report. An end which admits nobody leaves the
  // stored list as it is
  repeated string admitted_users = 34;
  // when the user task was created, read only where the message is an end (userTaskCompletedV1_1,
  // userTaskCancelledV1_1) and the first report about the task the cockpit gets. Without it the
  // task starts at the timestamp of the end
  optional google.protobuf.Timestamp created_at = 35;

}

// How the workflow module wants notifications for a user task to be delivered.
// The default (0) USER_CONFIG means "deliver according to each user's configuration".
enum NotificationDelivery {
  USER_CONFIG = 0;
  FORCE = 1;
  SUPPRESS = 2;
}

message UserTaskCompletedEvent {
  string id = 1;
  string api_version = 2;
  string user_task_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string initiator = 5;
  optional string source = 6;
  optional string comment = 7;
  // when the user task was created. Read only from an end which is the first report about the
  // task the cockpit gets. Without it the task starts at the timestamp of the end
  optional google.protobuf.Timestamp created_at = 8;
}

message UserTaskCancelledEvent {
  string id = 1;
  string api_version = 2;
  string user_task_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string initiator = 5;
  optional string source = 6;
  optional string comment = 7;
  // when the user task was created. Read only from an end which is the first report about the
  // task the cockpit gets. Without it the task starts at the timestamp of the end
  optional google.protobuf.Timestamp created_at = 8;
}

message UserTaskSuspendedEvent {
  string id = 1;
  string api_version = 2;
  string user_task_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string initiator = 5;
  optional string source = 6;
  optional string comment = 7;
}

message UserTaskActivatedEvent {
  string id = 1;
  string api_version = 2;
  string user_task_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string initiator = 5;
  optional string source = 6;
  optional string comment = 7;
}

message WorkflowCreatedOrUpdatedEvent {
  string id = 1;
  string api_version = 2;
  string workflow_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  string bpmn_process_id = 5;
  string ui_uri_path = 8;
  string ui_uri_type = 9;
  optional bool updated = 10;
  optional string business_id = 11;
  optional string initiator = 12;
  optional string source = 13;
  map<string, string> title = 15;
  optional string comment = 16;
  optional string bpmn_process_version = 17;
  DetailsMap details = 18;
  optional string details_fulltext_search = 19;
  repeated string accessible_to_users = 20;
  repeated string accessible_to_groups = 21;
  string workflow_module_id = 22;
  // when the workflow was started, read only where the message is an end (workflowCompletedV1_1,
  // workflowCancelledV1_1) and the first report about the workflow the cockpit gets. Without it
  // the workflow starts at the timestamp of the end
  optional google.protobuf.Timestamp created_at = 23;
}

message WorkflowCompletedEvent {
  string id = 1;
  string api_version = 2;
  string workflow_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string initiator = 5;
  optional string source = 6;
  optional string comment = 7;
  optional string bpmn_process_id = 8;
  optional string bpmn_process_version = 9;
  // when the workflow was started. Read only from an end which is the first report about the
  // workflow the cockpit gets. Without it the workflow starts at the timestamp of the end
  optional google.protobuf.Timestamp created_at = 10;
}

message WorkflowCancelledEvent {
  string id = 1;
  string api_version = 2;
  string workflow_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string initiator = 5;
  optional string source = 6;
  optional string comment = 7;
  optional string bpmn_process_id = 8;
  optional string bpmn_process_version = 9;
  // when the workflow was started. Read only from an end which is the first report about the
  // workflow the cockpit gets. Without it the workflow starts at the timestamp of the end
  optional google.protobuf.Timestamp created_at = 10;
}

message RegisterWorkflowModuleEvent {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  optional string source = 3;
  string workflow_module_id = 4;
  string uri = 5;
  optional string task_provider_api_uri_path = 6;
  optional string workflow_provider_api_uri_path = 7;
  repeated string accessible_to_groups = 8;
  repeated GroupHierarchy group_hierarchy = 9;
}
