openapi: 3.0.3
info:
  description: Business Cockpit API
  version: '1.0'
  title: BC-API
servers:
  - url: /api/v1_1
tags:
  - name: bpms
    description: BPMS Events

paths:
  /workflow-module/{id}:
    post:
      tags:
        - bpms
      summary: register a workflow-module or update the registration
      operationId: registerWorkflowModule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkflowModuleEvent"
      responses:
        200:
          description: successful operation
        400:
          $ref: "#/components/responses/Refused"
        401:
          description: You are not authorized to view the resource
        403:
          description: Accessing the resource you were trying to reach is forbidden
        500:
          $ref: "#/components/responses/Unexpected"
  /usertask/created:
    post:
      tags:
        - bpms
      summary: processes a user task CREATED event
      operationId: userTaskCreatedEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTaskCreatedEvent"
      responses:
        200:
          description: successful operation
        400:
          $ref: "#/components/responses/Refused"
        401:
          description: You are not authorized to view the resource
        403:
          description: Accessing the resource you were trying to reach is forbidden 
        500:
          $ref: "#/components/responses/Unexpected"
        503:
          $ref: "#/components/responses/NotNow"
  /usertask/{userTaskId}/updated:
    post:
      tags:
        - bpms
      summary: processes a user task UPDATED event
      operationId: userTaskUpdatedEvent
      parameters:
        - in: path
          name: userTaskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTaskUpdatedEvent"
      responses:
        200:
          description: successful operation
        400:
          $ref: "#/components/responses/Refused"
        401:
          description: You are not authorized to view the resource
        403:
          description: Accessing the resource you were trying to reach is forbidden 
        500:
          $ref: "#/components/responses/Unexpected"
        503:
          $ref: "#/components/responses/NotNow"
  /usertask/{userTaskId}/suspended:
    post:
      tags:
        - bpms
      summary: processes a user task SUSPENDED event
      operationId: userTaskSuspendedEvent
      parameters:
        - in: path
          name: userTaskId
          required: true
