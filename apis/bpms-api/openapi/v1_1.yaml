  /workflow/{workflowId}/updated:
    post:
      tags:
        - bpms
      summary: processes a workflow UPDATED event
      operationId: workflowUpdatedEvent
      parameters:
        - in: path
          name: workflowId
          description: The unique key of the workflow
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdatedEvent"
      responses:
        200:
          description: successful operation
        400:
          $ref: "#/components/responses/Refused"
        401:
          description: You are not authorized to view the resource
