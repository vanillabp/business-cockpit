      responses:
        200:
          description: successful operation
        400:
          $ref: "#/components/responses/Refused"
        401:
          description: You are not authorized to view the resource
        403:
          description: Accessing the resource you were trying to reach is forbidden
        500:
          $ref: "#/components/responses/Unexpected"
        503:
          $ref: "#/components/responses/NotNow"

components:
  # What the cockpit answers where a report does not go through, and what the sender does about
  # it. The body of a refusal is described in words and not as content: content would change the
  # Accept header the generated client sends and the media type the generated server produces.
  responses:
    Refused:
      description: >-
        The cockpit refuses the request, and it will refuse the same request every time. Do not
        send it again as it is. Change it first. Where a field breaks a rule of the schema, the
        body is one line of plain text which names each such field, for example
        "The request is not valid: 'bpmnProcessId' is missing.". Where the id in the path and the
        id in the body name different records, the body is empty.
    NotNow:
      description: >-
        The cockpit could not store the report right now, for example because MongoDB could not be
        reached. Nothing of the report was stored. Send the same report again later. The answer
        carries no Retry-After header, because the cockpit does not know when it can store again,
        so wait as long as your own backoff says.
    Unexpected:
      description: >-
        Something went wrong which the cockpit did not expect, for example a read from MongoDB
        which failed before anything was stored. Send the same request again later. If it keeps
        failing, the body holds the message of the error, and the log of the cockpit has the rest.
  schemas:
    UiUriType:
      type: string
      description: >-
        Which kind of user interface this workflow module brings. The cockpit carries the value
        and never reads it. What a value means is agreed between the workflow module and the user
        interface which loads it. The shipped user interface knows EXTERNAL for a module with
        pages of its own and WEBPACK_MF_REACT for a React bundle loaded by module federation.
    NotificationDelivery:
      type: string
      description: >-
        How the workflow module wants notifications for this user task to be delivered.
        An absent value is interpreted as USER_CONFIG.
      enum:
      - USER_CONFIG   # deliver according to each user's notification configuration (default)
      - FORCE         # always notify, overriding the user's configuration; marked as forced
      - SUPPRESS      # never notify from the cockpit (the workflow module notifies itself)
    UserTaskUpdatedEvent:
      type: object
      required:
      - id
      - userTaskId
      - timestamp
      - bpmnProcessId
      - taskDefinition
      - title
      - uiUriPath
      - uiUriType
      properties:
        id:
          type: string
          description: event id withing the source system
        updated:
          type: boolean
          description: Whether this event is about an update (otherwise creating a user task)
        userTaskId:
          type: string
          description: user task id
          example: Has to be unique across all reporting systems
        initiator:
          type: string
          description: The user who triggered the update. Null if the update is done by the system.
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the initial cause of this event (e.g. the time the task was created for ACTIVATED)
          example: 2019-05-21T13:30:26.202Z
        source:
          type: string
          description: name of the source system sending this event
        workflowModuleId:
          type: string
          description: The workflow module sending this event
        comment:
          type: string
          example: A comment describing the event. Is interpreted in the context of the event. E.g. the reason which caused CANCELLATION
        bpmnProcessId:
          type: string
          description: BPMN process ID
          example: taxi-ride
        bpmnProcessVersion:
          type: string
          description: Version of the BPMN process
        workflowTitle:
          type: object
          description: BPMN process title
          additionalProperties:
            type: string
          example:
            en: Taxi Ride
            de: Taxifahrt
        workflowId:
          type: string
          description: The unique key of the workflow
          example: c26f4d10-a7a7-44e5-97ed-cbfd06e760e1
        subWorkflowId:
          type: string
          description: The unique key of the Call-Activity which caused the user task (or the workflowId)
          example: c26f4d10-a7a7-44e5-97ed-cbfd06e760e1
        businessId:
          type: string
          description: The natural ID of the workflow (e.g. order-id)
          example: 123456
        title:
          type: object
          description: The rendered title of the user-task (may contain specific data)
          additionalProperties:
            type: string
          example:
            en: "Do ride #4711"
            de: "Führe die Fahrt #4711 durch"
        bpmnTaskId:
          type: string
          description: The BPMN user task's ID
          example: "Task_TaxiRide"
        taskDefinition:
          type: string
          description: The task's formkey
          example: "DoRideForm"
        taskDefinitionTitle:
          type: object
          description: The generic title of the user-task (must not contain specific data)
          additionalProperties:
            type: string
          example:
            en: Do ride
            de: Führe die Fahrt durch
        uiUriPath:
          type: string
          description: >-
            Where the user interface of this user task is found, as the workflow module reports
            it. The cockpit stores the value and hands it out unchanged. Working out an address
            from it is the business of the user interface, which reads uiUriType to know how.
          example: /remoteEntry.js
        uiUriType:
          $ref: '#/components/schemas/UiUriType'
        assignee:
          type: string
          example: driverA
        candidateUsers:
          type: array
          items:
            type: string
          example: []
        candidateGroups:
          type: array
          items:
            type: string
          example: [ "drivers" ]
        excludedCandidateUsers:
          type: array
          items:
            type: string
          example: []
        admittedUsers:
          type: array
          description: Users who may see this user-task although they are no candidate for it
          items:
            type: string
          example: []
        dueDate:
          type: string
          format: date-time
          example: 2020-05-21T13:30:26.202Z
        followUpDate:
          type: string
          format: date-time
          example: null
        details:
          type: object
          description: Properties for individual searches
          additionalProperties: true
          example: '{ "customer": "passanger A" }'
        detailsFulltextSearch:
          type: string
          description: List of words for fulltext searching details
        notificationDelivery:
          $ref: '#/components/schemas/NotificationDelivery'
    UserTaskLifecycleEvent:
      type: object
      required:
      - id
      - userTaskId
      - timestamp
      properties:
        id:
          type: string
          description: event id withing the source system
        userTaskId:
          type: string
          description: user task id
          example: Has to be unique across all reporting systems
        initiator:
          type: string
          description: The user who triggered the update. Null if the update is done by the system.
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the initial cause of this event (e.g. the time the task was created for ACTIVATED)
          example: 2019-05-21T13:30:26.202Z
        source:
          type: string
          description: name of the source system sending this event
        comment:
          type: string
          example: A comment describing the event. Is interpreted in the context of the event. E.g. the reason which caused CANCELLATION
    UserTaskCreatedEvent:
      allOf:
        - $ref: "#/components/schemas/UserTaskUpdatedEvent"
    UserTaskCompletedEvent:
      allOf:
        - $ref: "#/components/schemas/UserTaskUpdatedEvent"
    UserTaskCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/UserTaskUpdatedEvent"
    UserTaskSuspendedEvent:
      allOf:
        - $ref: "#/components/schemas/UserTaskLifecycleEvent"
    UserTaskActivatedEvent:
      allOf:
        - $ref: "#/components/schemas/UserTaskLifecycleEvent"
    WorkflowUpdatedEvent:
      type: object
      required:
        - id
        - workflowId
        - timestamp
        - bpmnProcessId
        - workflowModuleId
        - uiUriPath
        - uiUriType
      properties:
        id:
          type: string
          description: event id withing the source system
        updated:
          type: boolean
          description: Whether this event is about an update (otherwise creating a user task)
        workflowId:
          type: string
          description: The unique key of the workflow
          example: c26f4d10-a7a7-44e5-97ed-cbfd06e760e1
        businessId:
          type: string
          description: The natural ID of the workflow (e.g. order-id)
          example: AT0815
        initiator:
          type: string
          description: The user who triggered the update. Null if the update is done by the system.
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the initial cause of this event (e.g. the time the task was created for ACTIVATED)
          example: 2019-05-21T13:30:26.202Z
        source:
          type: string
          description: name of the source system sending this event
        workflowModuleId:
          type: string
          description: The workflow module sending this event
        title:
          type: object
          description: The rendered title of the workflow (may contain specific data)
          additionalProperties:
            type: string
          example:
            en: "Ride request #4711"
            de: "Fahrtanfrage #4711"
        comment:
          type: string
          example: A comment describing the event. Is interpreted in the context of the event. E.g. the reason which caused CANCELLATION
        bpmnProcessId:
          type: string
          description: BPMN process ID
          example: taxi-ride
        bpmnProcessVersion:
          type: string
          description: Version of the BPMN process (beneath the version tag)
        uiUriPath:
          type: string
          description: >-
            Where the user interface of this workflow is found, as the workflow module reports
            it. The cockpit stores the value and hands it out unchanged. Working out an address
            from it is the business of the user interface, which reads uiUriType to know how.
          example: /remoteEntry.js
        uiUriType:
          $ref: '#/components/schemas/UiUriType'
        accessibleToUsers:
          type: array
          items:
            type: string
          example: []
        accessibleToGroups:
          type: array
          items:
            type: string
          example: [ "drivers" ]
        details:
          type: object
          description: Properties for individual searches
          additionalProperties: true
          example: '{ "ride-request": "4711" }'
        detailsFulltextSearch:
          type: string
          description: List of words for fulltext searching details
    WorkflowCompletedEvent:
      allOf:
        - $ref: "#/components/schemas/WorkflowUpdatedEvent"
    WorkflowCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/WorkflowUpdatedEvent"
    WorkflowCreatedEvent:
      allOf:
        - $ref: "#/components/schemas/WorkflowUpdatedEvent"
    GroupHierarchy:
      type: object
      properties:
        group:
          type: string
        targets:
          type: array
          items:
            type: string
    RegisterWorkflowModuleEvent:
      type: object
      required:
        - id
      properties:
        uri:
          type: string
          description: An URI reachable to the business cockpit server providing APIs (task-provider, UI)
          example: http://localhost:9000/taxiride
        taskProviderApiUriPath:
          type: string
          description: A path added to workflowModuleUri to build a URI for the task-provider API
          example: /api/v1/task-provider
        workflowProviderApiUriPath:
          type: string
          description: A path added to workflowModuleUri to build a URI for the workflow-provider API
          example: /api/v1/workflow-details-provider
        accessibleToGroups:
          type: array
          description: The list of groups that are allowed to view this workflow module
          items:
            type: string
        groupHierarchy:
          type: array
          items:
            $ref: '#/components/schemas/GroupHierarchy'