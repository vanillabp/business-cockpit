openapi: 3.0.0
info:
  title: dev-shell-simulator
  version: '1.0'
  description: |
    What the dev shell simulator answers and no cockpit does. The simulator answers three
    interfaces, and this file describes the third one:

    - The BPMS API at /bpms/api/v1_1, described in apis/bpms-api. A workflow module reports its
      user tasks and cases there, as it does to the cockpit.
    - The official GUI API at /official-api/gui/api/v1, described in apis/official-gui-api. A
      user interface and a workflow module read from it, as they read from the cockpit at
      /gui/api/v1. Each system the simulator plays gets a prefix of its own, here /official-api,
      and the path of the original goes below it. So a generated client of the official GUI API
      takes http://localhost:8079/official-api as its address. The simulator answers the lists,
      a single user task or case, the workflow modules the user signed in sees, the user signed
      in and the notification settings of that user.
    - The paths below, which belong to the simulator alone. A dev shell switches between made-up
      users with them, and a test of a workflow module reads what the module reported and which
      workflow modules a user sees.

    Every path is written in full, so a client takes the address of the simulator as its base
    address, for example http://localhost:8079. None of the paths needs a login.
servers:
  - url: /

paths:
  /simulator-api/usertask/{userTaskId}/report:
    get:
      tags:
        - simulator
      summary: the last report about a user task
      description: |
        The last report about a user task which created, updated or ended it, exactly as the
        workflow module sent it to the BPMS API. A suspension or an activation does not replace
        it. The report shows what the official API leaves out, for example who must not work on
        the task, who may see it although he is no candidate, and how notifications are
        delivered.
      operationId: getLastReportOfUserTask
      parameters:
        - in: path
          name: userTaskId
          required: true
          description: The id of the user task
          schema:
            type: string
      responses:
        200:
          description: |
            The report, a JSON object with the fields of the BPMS API event which carried it
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        404:
          description: The simulator holds no user task of this id
  /simulator-api/workflow-module:
    get:
      tags:
        - simulator
      summary: the workflow modules a user sees
      description: |
        The registered workflow modules which the cockpit lists for this user at
        /gui/api/v1/workflow-module. A module which registered groups is listed for the members
        of one of these groups. A module which registered no groups is listed for everybody. The
        groups of the user are completed by the group hierarchies of all registered workflow
        modules, as the cockpit does it. The simulator answers the same list for the user signed
        in at /official-api/gui/api/v1/workflow-module. This path names the user instead, so a
        test needs no login cookie.
      operationId: getWorkflowModulesOfUser
      parameters:
        - in: query
          name: user
          required: true
          description: The id of the user, as the configuration of the simulator lists it
          schema:
            type: string
      responses:
        200:
          description: The workflow modules the user sees, sorted by their id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibleWorkflowModules'
        404:
          description: The simulator does not know the user
  /dev-shell/user/all/id:
    get:
      tags:
        - devShellUser
      summary: the ids of all users
      description: The dev shell lists these ids in its choice of users.
      operationId: allUsersIds
      responses:
        200:
          description: The ids of all configured users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /dev-shell/user/all:
    get:
      tags:
        - devShellUser
      summary: all users
      operationId: allUsers
      responses:
        200:
          description: All configured users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevShellUser'
  /dev-shell/user/:
    get:
      tags:
        - devShellUser
      summary: the id of the user the dev shell switched to
      description: The id comes from the login cookie of the request.
      operationId: getUser
      responses:
        200:
          description: The id of the user, as plain text
          content:
            text/plain:
              schema:
                type: string
        404:
          description: Nobody is signed in
  /dev-shell/user/details:
    get:
      tags:
        - devShellUser
      summary: the user the dev shell switched to
      description: |
        The user comes from the login cookie of the request. The official GUI API answers the
        same user at /official-api/gui/api/v1/app/current-user, there in the form the cockpit answers.
      operationId: getUserDetails
      responses:
        200:
          description: The user signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevShellUser'
        404:
          description: Nobody is signed in, or the simulator does not know the user
  /dev-shell/user/{userId}:
    get:
      tags:
        - devShellUser
      summary: one user
      operationId: getUserById
      parameters:
        - in: path
          name: userId
          required: true
          description: The id of the user
          schema:
            type: string
      responses:
        200:
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevShellUser'
        404:
          description: The simulator does not know the user
    post:
      tags:
        - devShellUser
      summary: switch to another user
      description: |
        The answer sets the login cookie of the user, the same cookie the cockpit sets. The id
        '---' signs the current user out and removes the cookie.
      operationId: changeUser
      parameters:
        - in: path
          name: userId
          required: true
          description: The id of the user, or '---' to sign out
          schema:
            type: string
      responses:
        200:
          description: Switched
        400:
          description: The id is empty
        404:
          description: The simulator does not know the user

components:
  schemas:
    VisibleWorkflowModules:
      type: object
      description: |
        The workflow modules a user sees, in the form the cockpit answers at
        /gui/api/v1/workflow-module.
      required:
        - modules
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/VisibleWorkflowModule'
    VisibleWorkflowModule:
      type: object
      description: One workflow module, with the same fields the cockpit answers.
      required:
        - id
        - version
        - uri
      properties:
        id:
          type: string
          description: The id of the workflow module
        version:
          type: integer
          format: int64
          description: |
            Counts the registrations of the module. The first one is 0, and each later one adds 1.
        uri:
          type: string
          description: |
            The path below which a user interface reaches the module, /wm/ followed by its id, as
            in the cockpit. Null if the module registered no URI.
    DevShellUser:
      type: object
      description: A made-up user, as the configuration of the simulator lists it.
      required:
        - id
      properties:
        id:
          type: string
          description: The id the user signs in with
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        groups:
          type: array
          description: The groups of the user, which become the user's authorities
          items:
            type: string
        attributes:
          type: object
          description: More attributes, each with a list of values
          additionalProperties:
            type: array
            items:
              type: string
