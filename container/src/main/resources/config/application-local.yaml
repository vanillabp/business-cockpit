spring:
  # Spring Boot 4 renamed the connection settings from "spring.data.mongodb" to "spring.mongodb"; the
  # old keys are deprecated at level "error" and are no longer bound, so the URI below would have been
  # ignored without a word and the driver would have fallen back to an unauthenticated localhost:27017.
  # directConnection is required because the compose Mongo is a single node replica set that advertises
  # its member as "business-cockpit-mongo:27017" - a name that does not resolve outside the compose
  # network. Without it the driver discovers that host and never reaches the server it just talked to.
  mongodb:
    uri: mongodb://business-cockpit:business-cockpit@localhost:27017/business-cockpit?directConnection=true

bpms-api:
  username: abc
  password: "{noop}123"

business-cockpit:
  title-short: VanillaBP-BC
  title-long: VanillaBP Business Cockpit
  application-version: "@project.version@"
  build-timestamp: "@build.timestamp@"
  application-uri: http://localhost:8080
  jwt:
    hmacSHA256-base64: 4FTHgU8uHPy/ahy8IhXHj/K/BVlh7snSUtf3m1XWLkg=
