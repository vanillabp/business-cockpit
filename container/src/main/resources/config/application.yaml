logging:
  level:
    ROOT: INFO

mongodb:
  # A user task the cockpit has confirmed to a BPMS adapter has to stay confirmed. 'majority' is
  # what makes that true: a write which a majority of the replica set has survives a primary which
  # steps down, and a write which only the primary has does not. Any other value is a value this
  # installation has chosen, and the cockpit says on every start what it is really writing with.
  # The wiki page "Running the Business Cockpit" lists what goes wrong with each of them.
  write-concern: majority
  # With 'w: majority' the server journals on the acknowledging nodes by itself, unless the
  # replica set was configured with 'writeConcernMajorityJournalDefault: false'. Asking for the
  # journal here says what the cockpit wants instead of relying on a setting of the database.
  write-concern-journal: true

spring:
  threads:
    virtual:
      # the application blocks from end to end. A virtual thread per request keeps that cheap,
      # even while a request waits for MongoDB, for a workflow module behind the proxy or for a
      # server-sent-event client
      enabled: true
  mvc:
    static-path-pattern: "/**"
  http:
    clients:
      # timeouts of the RestClient which the gateway proxies workflow-module requests with. There
      # is no read timeout on purpose. A proxied server-sent-event stream is idle between events,
      # and any read timeout would tear it down in the middle.
      connect-timeout: 10s
  web:
    resources:
      static-locations: "classpath:/static/"
    error:
      # Spring Boot 4 moved this out of "server.error.whitelabel". The old key is deprecated at
      # level "error", so it is not bound any more and would have been ignored without a word.
      whitelabel:
        enabled: false

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 2048

bpms-api:
  realm-name: BPMS-API
