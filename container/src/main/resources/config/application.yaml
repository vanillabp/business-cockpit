logging:
  level:
    ROOT: INFO

spring:
  threads:
    virtual:
      # the application blocks from end to end. A virtual thread per request keeps that cheap,
      # even while a request waits for MongoDB, for a workflow module behind the proxy or for a
      # server-sent-event client
      enabled: true
  mvc:
    static-path-pattern: "/**"
  http:
    clients:
      # timeouts of the RestClient which the gateway proxies workflow-module requests with. There
      # is no read timeout on purpose. A proxied server-sent-event stream is idle between events,
      # and any read timeout would tear it down in the middle.
      connect-timeout: 10s
  web:
    resources:
      static-locations: "classpath:/static/"
    error:
      # Spring Boot 4 moved this out of "server.error.whitelabel". The old key is deprecated at
      # level "error", so it is not bound any more and would have been ignored without a word.
      whitelabel:
        enabled: false

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 2048

bpms-api:
  realm-name: BPMS-API
