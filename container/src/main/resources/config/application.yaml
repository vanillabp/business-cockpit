logging:
  level:
    ROOT: INFO

spring:
  threads:
    virtual:
      # the application is blocking end to end; a virtual thread per request keeps that cheap even
      # while a request waits for MongoDB, a workflow module behind the proxy or an SSE client
      enabled: true
  mvc:
    static-path-pattern: "/**"
  http:
    clients:
      # timeouts of the RestClient the gateway proxies workflow-module requests with. No read
      # timeout on purpose: a proxied server-sent-event stream is idle between events, and any
      # read timeout would tear it down mid-stream.
      connect-timeout: 10s
  web:
    resources:
      static-locations: "classpath:/static/"
    error:
      # Spring Boot 4 moved this out of "server.error.whitelabel"; the old key is deprecated at
      # level "error", which means it is not bound any more - it would have been ignored silently.
      whitelabel:
        enabled: false

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 2048

bpms-api:
  realm-name: BPMS-API
