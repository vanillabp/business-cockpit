# Switches on the reference e-mail notification medium and points it at the Mailpit container of
# development/docker-compose.yaml. Notification e-mails can then be checked by hand at
# http://localhost:8025 (web UI) or through its REST API below http://localhost:8025/api/v1.
#
# It is meant to be used together with the profile 'local', for example

#   java -DworkerId=local -Dspring.profiles.active=local,mailpit -jar target/business-cockpit-*-runnable.jar
spring:
  mail:
    host: localhost
    port: 1025

business-cockpit:
  notification:
    # every 10 seconds instead of the default minute, so a manual test does not have to wait
    interval: PT10S
    smtp:
      enabled: true
      from: business-cockpit@localhost
