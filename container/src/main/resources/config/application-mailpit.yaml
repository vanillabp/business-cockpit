# Activates the reference e-mail notification medium and points it at the Mailpit container of
# development/docker-compose.yaml, so notification e-mails can be checked manually via
# http://localhost:8025 (web UI) or its REST API below http://localhost:8025/api/v1.
#
# Meant to be combined with the profile 'local', e.g.
#   java -DworkerId=local -Dspring.profiles.active=local,mailpit -jar target/business-cockpit-*-runnable.jar
spring:
  mail:
    host: localhost
    port: 1025

business-cockpit:
  notification:
    # every 10 seconds instead of the default minute, so a manual test does not have to wait
    interval: PT10S
    smtp:
      enabled: true
      from: business-cockpit@localhost
