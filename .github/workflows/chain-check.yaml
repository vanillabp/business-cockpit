name: Chain check
# Once a night, bin/check-the-chain.sh looks at the main branches of the four Business
# Cockpit repositories and of the MongoDB changeset library. It asks whether the pins the
# four share are the same, whether a pin stayed behind without a pull request or a reason,
# whether the newest run on main was green, and whether the published snapshot belongs to
# the head of main. Nothing is built and no test runs again; the script reads the GitHub
# API, Maven Central and GitHub Packages.
#
# None of this is a pull-request check. A pin which drifts apart, a main which nobody
# pushed to for days and a snapshot which stayed old all come from something which did NOT
# happen, so there is no pull request to hang them on.
#
# A finding becomes an issue. A finding which is still there the next night gets a comment
# on that issue, never a second issue. A green night after a red one gets a comment too,
# and the issue stays open until somebody closes it: one green night does not prove a fix.
# The same pattern as the nightly release-line matrix of businesscockpit-camunda8-adapter.
#
# The report of every run, a green one too, starts and ends with the time it was asked,
# and is written to the summary of the run. A question the script could not answer counts
# as red, so a check which cannot see looks different from a check which saw nothing.
on:
  schedule:
    # Asked at a crooked minute, because GitHub's queue is longest on the hour, and after
    # the release-line matrix of the Camunda 8 adapter, which asks at 23:47 UTC, so the
    # newest run of that matrix is usually the one of the same night. GitHub starts a
    # scheduled run hours late at times; the result is still there in the morning.
    - cron: "13 2 * * *"
  workflow_dispatch:
concurrency:
  group: business-cockpit-chain-check
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the runs of this repository; the other repositories are public and read as such
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Ask the four questions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Packages asks for a token even for a public package, and the token of the
          # workflow cannot read the packages of another repository. The builds read them
          # with the same pair, see github-packages-settings.xml.
          PACKAGES_USER: ${{ secrets.VANILLABP_USER_NAME }}
          PACKAGES_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
        run: |
          set +e
          bin/check-the-chain.sh > "$RUNNER_TEMP/report.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        # Only for main: a dispatch on a branch says nothing about an issue of main.
        if: always() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # empty when the step above did not get as far as the script's end
          STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          label=chain-check
          title="Chain check: something is off"

          # The label is how the open issue is found again. Creating a label which is
          # already there is an error, and that is the normal case here.
          gh label create "$label" --color B60205 \
            --description "The nightly chain check found something" \
            >/dev/null 2>&1 || true

          number=$(gh issue list --state open --label "$label" --limit 100 \
            --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')

          report="$RUNNER_TEMP/report.md"
          body="$RUNNER_TEMP/body.md"

          if [ "$STATUS" != "0" ]; then
            {
              case "$STATUS" in
                1) echo "The chain check found something." ;;
                2) echo "The chain check could not answer every question, so this night is not green." ;;
                *) echo "The chain check did not finish, so this night says nothing." ;;
              esac
              echo
              echo "- run: $RUN_URL"
              echo
              if [ -s "$report" ]; then
                cat "$report"
              fi
              echo
              echo "<!-- chain-check-state: red -->"
            } > "$body"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              gh issue create --title "$title" --label "$label" --body-file "$body"
            fi
            exit 0
          fi

          # Green. Only worth saying where an issue is open and the last thing it was told
          # was red, otherwise every quiet night would add a comment.
          [ -n "$number" ] || exit 0
          last=$(gh issue view "$number" --json body,comments \
            | jq -r '[.body] + [.comments[].body] | last' \
            | sed -n 's/.*chain-check-state: \([a-z]*\).*/\1/p' | tail -1)
          [ "$last" = "red" ] || exit 0
          {
            echo "The chain check found nothing this night."
            echo
            echo "- run: $RUN_URL"
            echo
            echo "This issue is not closed by that, on purpose. Whoever fixed what it"
            echo "reported knows that it is fixed, and closes it."
            echo
            echo "<!-- chain-check-state: green -->"
          } > "$body"
          gh issue comment "$number" --body-file "$body"
      - name: The run is red when the check was not green
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          if [ "$STATUS" != "0" ]; then
            echo "bin/check-the-chain.sh ended with '${STATUS:-nothing}', see the report above." >&2
            exit 1
          fi
