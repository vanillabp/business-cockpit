name: Publish snapshots
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
# Where Maven reads the snapshots of the other VanillaBP repositories from, see
# .github/maven/settings.xml: from GitHub Packages once the organization sets the Actions
# variable VANILLABP_SNAPSHOTS_FROM to 'github-packages', else from the snapshot repository of
# Maven Central. Reading GitHub Packages needs a token even for public packages. The
# GITHUB_TOKEN of the run is enough, because every job which runs Maven asks for
# 'packages: read'.
env:
  VBP_SNAPSHOTS_FROM: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && 'github-packages' || 'central' }}"
  # The settings file turns on its profile for GitHub Packages by VBP_SNAPSHOTS_FROM. Maven
  # sees that, but a Quarkus test does not: it resolves the deployment artifacts of the
  # extensions with a resolver of its own inside the test JVM, and that resolver takes the
  # profiles from the Maven command line only. So every Maven call of this workflow also
  # names the profile, by this variable. It is empty for 'central', which leaves the calls
  # as they were.
  VBP_SNAPSHOTS_PROFILE: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && '-Psnapshots-from-github-packages' || '' }}"
  VBP_PACKAGES_READ_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
# Only main writes the shared snapshot coordinates. A snapshot has the same coordinates on
# every branch, so a push to a branch used to hand every consumer a version of this
# repository which no pull request had agreed to yet. On 2026-09-22 the branch of a rename
# in 'extensions-commons/test-support' published at 08:18 UTC and made main of all three
# adapter repositories red, including the pull requests which had nothing to do with that
# rename. The three adapter repositories have always published from main alone; this
# repository now does the same.
#
# Somebody who needs a snapshot from a branch, to try a change in another repository before
# it is merged, runs this workflow by hand on that branch. Then the overwrite is a decision
# and not a side effect of a push.
#
# The snapshots go to two places in one build, with the profile 'publish-snapshots' of the
# POM. GitHub Packages is what the builds of the other VanillaBP repositories read, so they
# do not ask Maven Central for every snapshot and are not stopped by its rate limit. The
# snapshot repository of Maven Central stays for everybody else: anybody can read it there
# without a login. Writing needs the Central Portal token, which the pull-request build never
# gets.
#
# The job runs only where the Actions variable VANILLABP_PUBLISH is 'true'. The vanillabp
# organization sets it for all its repositories. A fork does not have it, so a fork never
# publishes.
#
# Two concurrency groups: one for main, one shared by the runs started by hand. GitHub keeps
# at most one waiting run per group, and a newer run of the same group takes the waiting one
# out. The replaced run ends as 'cancelled' without ever starting a job, and nothing says
# that a publish is missing. Main lost two publishes that way on 2026-09-13. Run
# 34750580160 at 09:56 and run 34770715317 at 17:09 were both pushes to main, both
# waiting, and a push to a feature branch took the waiting place from each of them. The
# newest state of main stayed unpublished until somebody pushed to main again.
#
# With main in a group of its own, only a newer push to main can take main's waiting run
# out, and that is what should happen, because the newer run carries the newer artifacts.
#
# 'cancel-in-progress: false' protects the run which is already running, and nothing else.
# The pull-request build has a group of its own, one per pull request, because it publishes
# nothing. The release has a group of its own too, so it can run beside a publish: it
# writes fixed versions, and the snapshot it ends with carries the next version, which no
# branch holds yet.
concurrency:
  group: business-cockpit-publish-${{ github.ref == 'refs/heads/main' && 'main' || 'branches' }}
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    if: "${{ vars.VANILLABP_PUBLISH == 'true' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # writes the snapshots to GitHub Packages of this repository and reads those of the
      # other repositories. A pull request from a fork gets a token which can only read,
      # whatever this line says
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          # Into a file and not through a pipe: a transfer which breaks halfway has already
          # written to tar, so a repeat of curl could not mend it. Nine repeats wait about
          # eight minutes, long enough for a 429 of Central to pass.
          curl -fsSL --retry 9 --retry-all-errors --retry-max-time 600 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/apache-maven.tar.gz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
      - name: Publish package
        # This run publishes Java artifacts only. The repository holds no user interface, see
        # decision 63 in the repository's DECISIONS.md.
        #
        # The profile 'publish-snapshots' sends the snapshot to GitHub Packages of this
        # repository and to the snapshot repository of Maven Central. The runnable jars of
        # 'build-runnable-jars' go to both as well.
        run: |
          mvn -s .github/maven/settings.xml ${VBP_SNAPSHOTS_PROFILE} --batch-mode --no-transfer-progress --update-snapshots \
          deploy -P build-runnable-jars,publish-snapshots
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect the coverage reports for GitHub Pages
        # only from the default branch: the badges of the README read the published reports, so
        # a build of any other branch would let them show a number nobody released
        if: github.ref_name == github.event.repository.default_branch
        run: |
          mkdir -p coverage/application-spring-boot-report coverage/extensions-commons-spring-boot-report coverage/extensions-commons-quarkus-report
          cp -R test-coverage-report/application/spring-boot/report/. coverage/application-spring-boot-report/
          cp -R test-coverage-report/extensions-commons/spring-boot/report/. coverage/extensions-commons-spring-boot-report/
          cp -R test-coverage-report/extensions-commons/quarkus/report/. coverage/extensions-commons-quarkus-report/
      - name: Upload the coverage reports as a GitHub Pages artifact
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage

  deploy-coverage-report:
    # publishes what the job above collected to https://vanillabp.github.io/business-cockpit/,
    # which is where the coverage badges of the README point
    if: github.ref_name == github.event.repository.default_branch
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
