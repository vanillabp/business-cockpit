name: Publish snapshots
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
# Only main writes the shared snapshot coordinates. A snapshot has the same coordinates on
# every branch, so a push to a branch used to hand every consumer a version of this
# repository which no pull request had agreed to yet. On 2026-09-22 the branch of a rename
# in 'extensions-commons/test-support' published at 08:18 UTC and made main of all three
# adapter repositories red, including the pull requests which had nothing to do with that
# rename. The three adapter repositories have always published from main alone; this
# repository now does the same.
#
# Somebody who needs a snapshot from a branch, to try a change in another repository before
# it is merged, runs this workflow by hand on that branch. Then the overwrite is a decision
# and not a side effect of a push.
#
# The snapshots go to the snapshot repository of Maven Central. Anybody can read them there
# without a login. Writing needs the Central Portal token, which the pull-request build never
# gets.
#
# Two concurrency groups: one for main, one shared by the runs started by hand. GitHub keeps
# at most one waiting run per group, and a newer run of the same group takes the waiting one
# out. The replaced run ends as 'cancelled' without ever starting a job, and nothing says
# that a publish is missing. Main lost two publishes that way on 2026-09-13. Run
# 34750580160 at 09:56 and run 34770715317 at 17:09 were both pushes to main, both
# waiting, and a push to a feature branch took the waiting place from each of them. The
# newest state of main stayed unpublished until somebody pushed to main again.
#
# With main in a group of its own, only a newer push to main can take main's waiting run
# out, and that is what should happen, because the newer run carries the newer artifacts.
#
# 'cancel-in-progress: false' protects the run which is already running, and nothing else.
# The pull-request build has a group of its own, one per pull request, because it publishes
# nothing. The release has a group of its own too, so it can run beside a publish: it
# writes fixed versions, and the snapshot it ends with carries the next version, which no
# branch holds yet.
concurrency:
  group: business-cockpit-publish-${{ github.ref == 'refs/heads/main' && 'main' || 'branches' }}
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # read only. This job no longer writes npm packages to GitHub Packages, see decision 62
      # in the repository's DECISIONS.md
      packages: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
          # the server of the profile 'central-portal' in io.vanillabp:release-parent. The
          # two names are environment variables, and only the step which publishes sets them
          server-id: vanillabp-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Publish package
        # This run publishes Java artifacts only. The Maven build does not build the user
        # interfaces any more, so no npm package goes out. The npm snapshots published before stay
        # where they are. See decision 62 in the repository's DECISIONS.md.
        #
        # The profile 'central-portal' sends a version ending in -SNAPSHOT straight to the
        # snapshot repository of Maven Central. The settings file is there for the MongoDB
        # changeset library alone, whose snapshot is still on GitHub Packages.
        run: |
          mvn --batch-mode --no-transfer-progress --update-snapshots -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml \
          deploy -P build-runnable-jars,central-portal
        env:
          USER_NAME: ${{ secrets.VANILLABP_USER_NAME }}
          USER_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}
      - name: Collect the coverage reports for GitHub Pages
        # only from the default branch: the badges of the README read the published reports, so
        # a build of any other branch would let them show a number nobody released
        if: github.ref_name == github.event.repository.default_branch
        run: |
          mkdir -p coverage/application-spring-boot-report coverage/extensions-commons-spring-boot-report coverage/extensions-commons-quarkus-report
          cp -R test-coverage-report/application/spring-boot/report/. coverage/application-spring-boot-report/
          cp -R test-coverage-report/extensions-commons/spring-boot/report/. coverage/extensions-commons-spring-boot-report/
          cp -R test-coverage-report/extensions-commons/quarkus/report/. coverage/extensions-commons-quarkus-report/
      - name: Upload the coverage reports as a GitHub Pages artifact
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage

  deploy-coverage-report:
    # publishes what the job above collected to https://vanillabp.github.io/business-cockpit/,
    # which is where the coverage badges of the README point
    if: github.ref_name == github.event.repository.default_branch
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
