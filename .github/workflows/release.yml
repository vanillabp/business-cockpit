name: Release 🚀

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
concurrency:
  # One release of this repository at a time. Two releases at once would deploy the same
  # coordinates to Maven Central, write the same tag and work on the same release branch.
  # GitHub keeps at most one waiting run per group, so a third dispatch while one release
  # runs and one waits ends the waiting one as 'cancelled' without ever starting a job.
  # A release is dispatched by hand, so somebody is there to notice and dispatch again.
  # 'cancel-in-progress: false' protects the run which is already running and nothing
  # else, which is what a release needs: it deploys to Maven Central and pushes a tag,
  # and neither of those survives being cut in half.
  #
  # The publish keeps its own two groups, so a release and a publish can run at the same
  # time. They write different things. The release deploys fixed versions to Maven Central,
  # and the snapshot it publishes there at the end carries the next version, which no branch
  # holds yet. Its own pushes trigger no publish either,
  # because publish-snapshots.yaml ignores 'release/**'. What stays open is a
  # release of a version older than the snapshot main carries: the next version is then
  # main's version, and the two snapshot deploys meet. A run has one group and the publish
  # has two, so that case cannot be wired away here, and the release version is what keeps
  # it shut.
  group: business-cockpit-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    # No npm package is released. The Maven build does not build the user interfaces any more,
    # and the package.json files keep their versions. See decision 62 in the repository's
    # DECISIONS.md.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so the release brings its own 3.9. Remove this step once a plugin
      # version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Extract last released version
        run: |
          apiUrl="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          lastReleasedVersionApiResult=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${apiUrl}")
          lastReleasedVersion=$(echo "${lastReleasedVersionApiResult}" \
            | jq -r '.tag_name')
          if [ "${lastReleasedVersion}" = "null" ] || [ -z "${lastReleasedVersion}" ]; then
            echo "No GitHub release found using ${apiUrl}, falling back to first commit"
          
            git fetch --quiet --depth=1 origin
            firstCommit=$(git rev-list --max-parents=0 HEAD)
          
            lastReleasedVersion="${firstCommit}"
          else
            # strip leading 'v' if present
            lastReleasedVersion="${lastReleasedVersion#v}"
          fi          
          echo "LAST_RELEASED_VERSION=${lastReleasedVersion}" >> "${GITHUB_ENV}"
          echo "Last released version: ${lastReleasedVersion}"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
          cache: maven
          server-id: vanillabp-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Create release branch
        run: |
          git checkout -b release/${{ github.event.inputs.release_version }} origin/main

      - name: Set Maven release version
        run: |
          mvn --no-transfer-progress versions:set -DnewVersion=${{ github.event.inputs.release_version }}
          find . -name pom.xml.versionsBackup -delete

      - name: Check for SNAPSHOT dependencies
        run: |
          SNAPSHOT_POMS=$(grep -R "<.*>.*SNAPSHOT<\/.*>" . --include=pom.xml || true)
      
          if [ -n "$SNAPSHOT_POMS" ]; then
            echo "::warning::Found SNAPSHOT dependencies in the project:"
            echo "$SNAPSHOT_POMS"
          else
            echo "✅ No SNAPSHOT dependencies found."
          fi
          # Always exit successfully
          exit 0
          
      - name: Build & deploy to Maven Central
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs \
            -DaltDeploymentRepository=local::default::file:target/staging \
            -Dgpg.passphrase=$GPG_PASSPHRASE \
            clean deploy -Prelease,central-portal
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}

      - name: Commit release version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Prepare release v${{ github.event.inputs.release_version }}"

      - name: Build runnable JARs
        run: |
          cd container && mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs package spring-boot:repackage && cd ..
          cd development/simulator && mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs package spring-boot:repackage && cd ..
          cd dev-shell-simulator && mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs package spring-boot:repackage && cd ../..

      - name: Create Git tag
        run: |
          git tag -a "${{ github.event.inputs.release_version }}" -m "Release ${{ github.event.inputs.release_version }}"
          git push origin --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          name: v${{ github.event.inputs.release_version }}
          generate_release_notes: true
          append_body: |
            
            **Full Changelog:** [`${{ env.LAST_RELEASED_VERSION }}...${{ github.event.inputs.release_version }}`](https://github.com/vanillabp/business-cockpit/compare/${{ env.LAST_RELEASED_VERSION }}...${{ github.event.inputs.release_version }})
          files: |
            **/*-runnable.jar
          draft: true

      - name: Calculate next snapshot version
        run: |
          RELEASE_VERSION=${{ github.event.inputs.release_version }}
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          NEXT_PATCH=$((patch + 1))
          echo "NEXT_SNAPSHOT=$major.$minor.${NEXT_PATCH}-SNAPSHOT" >> $GITHUB_ENV

      - name: Set next snapshot version
        run: |
          mvn --no-transfer-progress versions:set -DnewVersion=${{ env.NEXT_SNAPSHOT }}
          find . -name pom.xml.versionsBackup -delete

      # The Java snapshot goes to the snapshot repository of Maven Central through the profile
      # 'central-portal'. The settings file is there for the MongoDB changeset library, whose
      # snapshot is still on GitHub Packages.
      - name: Build & publish new snapshot packages
        run: |
          mvn --batch-mode --no-transfer-progress -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml \
          deploy -P central-portal
        env:
          USER_NAME: ${{ secrets.VANILLABP_USER_NAME }}
          USER_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}

      - name: Commit next snapshot version
        run: |
          git add -A
          git commit -m "Set next version ${{ env.NEXT_SNAPSHOT }}"
          git push origin HEAD:release/${{ github.event.inputs.release_version }}
          
      - name: Create PR to merge release branch into main
        run: |
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
          gh pr create \
            --title "Merge release/${{ github.event.inputs.release_version }} into main" \
            --body "Automated PR to merge release branch." \
            --base main \
            --head release/${{ github.event.inputs.release_version }}
