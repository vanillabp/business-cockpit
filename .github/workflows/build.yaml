name: Build

on:
  pull_request:
  workflow_dispatch:
  # The nightly build calls this workflow as it is, so the night proves what a pull request
  # proves. See nightly-build.yaml.
  workflow_call:

# A group per pull request. GitHub keeps at most one waiting run per group, and a
# newer run takes the place of the one that waits. The replaced run ends as
# 'cancelled' without ever starting a job, so the pull request is left with no
# build result and nothing says that a result is missing. Every cancelled run this
# workflow ever had is of that kind: 24 by 2026-09-13, not one of them with a job.
# Run 34644153553 was the build of the story branch feature/233-switch-to-0-9-0.
# 'cancel-in-progress: false' does not help, because it only protects the run which
# is already running.
#
# With the ref in the group name, a build waits only for another build of the same
# pull request, and there the newest commit is the one which keeps its run. Builds
# of different pull requests run beside each other, which is safe because this
# build runs 'install' and uploads nothing. The publish workflow has its own groups,
# where two runs really do overwrite each other's snapshot.
concurrency:
  group: business-cockpit-pr-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      # the Maven the publish of main runs with, see publish-snapshots.yaml for why it is not
      # the 3.10 of the runner image
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      - name: Build and test
        # '--update-snapshots', because this build reads the snapshots of the VanillaBP platform and
        # Maven checks a snapshot once a day by default. The runner restores its local repository
        # from a cache, so without this flag a build compiles against whatever the cache holds: the
        # extension SPI of story 295 was published two hours before the build which said its package
        # did not exist.
        #
        # 'install' alone: it runs through verify, which is where the aggregated coverage reports
        # are written, and it puts the reactor's artifacts into the local repository, which the
        # Spring Boot tests of the container read from. Adding 'verify' after it would run the
        # whole lifecycle twice.
        #
        # The VanillaBP snapshots come from the snapshot repository of Maven Central, without a
        # login. The settings file and the two secrets are there for the MongoDB changeset
        # library alone, whose snapshot is still on GitHub Packages.
        run: |
          mvn --batch-mode --no-transfer-progress --update-snapshots -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml \
          install
        env:
          USER_NAME: ${{ secrets.VANILLABP_USER_NAME }}
          USER_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
