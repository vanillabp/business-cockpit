name: Build

on:
  pull_request:
  workflow_dispatch:

# A group per pull request. GitHub keeps at most one waiting run per group, and a
# newer run takes the place of the one that waits. The replaced run ends as
# 'cancelled' without ever starting a job, so the pull request is left with no
# build result and nothing says that a result is missing. Every cancelled run this
# workflow ever had is of that kind: 24 by 2026-09-13, not one of them with a job.
# Run 34644153553 was the build of the story branch feature/233-switch-to-0-9-0.
# 'cancel-in-progress: false' does not help, because it only protects the run which
# is already running.
#
# With the ref in the group name, a build waits only for another build of the same
# pull request, and there the newest commit is the one which keeps its run. Builds
# of different pull requests run beside each other, which is safe because this
# build runs 'install' and uploads nothing. The publish workflow has its own groups,
# where two runs really do overwrite each other's snapshot.
concurrency:
  group: business-cockpit-pr-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Configure npm authentication for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@vanillabp:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
      - name: Build and test
        # '--update-snapshots', because this build reads the snapshots of the VanillaBP platform and
        # Maven checks a snapshot once a day by default. The runner restores its local repository
        # from a cache, so without this flag a build compiles against whatever the cache holds: the
        # extension SPI of story 295 was published two hours before the build which said its package
        # did not exist.
        #
        # 'install' alone: it runs through verify, which is where the aggregated coverage reports
        # are written, and it puts the reactor's artifacts into the local repository, which the
        # Spring Boot tests of the container read from. Adding 'verify' after it would run the
        # whole lifecycle twice.
        #
        # '-Pjava-install' leaves the npm modules out of the reactor. That is where most of the
        # build time goes, and nothing outside this repository reads the frontend packages while
        # the backend is being refactored. What the frontend still owes a pull request is checked
        # beside this job, see 'frontend' below.
        run: |
          mvn --batch-mode --no-transfer-progress --update-snapshots -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml \
          -Dnpm.registry=https://npm.pkg.github.com/ \
          -Dskip.npm.publish-snapshot=true \
          -Pjava-install \
          install
        env:
          USER_NAME: ${{ secrets.VANILLABP_USER_NAME }}
          USER_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # What the Java build leaves out. It runs beside that build rather than inside it, so a type
  # error is reported at the same time as a failing test and neither waits for the other.
  #
  # The packages are type-checked and tested, and nothing is bundled. Why that is enough, and what
  # it leaves out, is written in bin/frontend-checks.sh, which is also what a developer runs.
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # the version the Maven build installs for the frontend modules, see the
          # frontend-maven-plugin configuration of the root POM
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Generate the sources the frontend is made of
        # Two TypeScript clients are generated from OpenAPI documents rather than written, and
        # both are git-ignored, so a fresh checkout has neither: the package
        # apis/official-gui-api/client, and the web application's own client under
        # src/client/gui. The generator runs with a helper of this repository, which is why that
        # one is installed first. 'generate-sources' and not 'install' for the rest: the Java
        # side is built by the job beside this one, and nothing here needs a jar.
        # '-Pjava-install' keeps every npm step of the reactor out of this; npm is run below.
        run: |
          mvn --batch-mode --no-transfer-progress --update-snapshots -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml \
          -Pjava-install -DskipTests -pl openapi-generator-fixes install
          mvn --batch-mode --no-transfer-progress --update-snapshots -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml \
          -Pjava-install -DskipTests \
          -pl apis/official-gui-api/client,business-cockpit -am \
          generate-sources
        env:
          USER_NAME: ${{ secrets.VANILLABP_USER_NAME }}
          USER_TOKEN: ${{ secrets.VANILLABP_USER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the local npm registry
        # The packages of this repository depend on each other through a registry, so the check
        # brings the one the build already uses: Verdaccio, configured in development/verdaccio
        # to take @vanillabp packages from anybody. Nothing is published to the outside.
        run: |
          docker build --quiet --tag business-cockpit-verdaccio development/verdaccio
          docker run --detach --name verdaccio --publish 4873:4873 \
            --volume "$PWD/development/verdaccio/conf:/verdaccio/conf" \
            business-cockpit-verdaccio
          timeout 120 bash -c 'until curl --silent --fail http://localhost:4873/-/ping > /dev/null; do sleep 2; done'
      - name: Configure npm for the local registry
        # the token is not read by Verdaccio, it only has to be there
        run: |
          echo "@vanillabp:registry=http://localhost:4873/" > ~/.npmrc
          echo "//localhost:4873/:_authToken=\"fake\"" >> ~/.npmrc
      - name: Type-check and test the frontend
        run: bin/frontend-checks.sh
