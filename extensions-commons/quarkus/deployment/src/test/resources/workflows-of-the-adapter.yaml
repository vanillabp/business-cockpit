quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:business-cockpit-workflows-of-the-adapter;DB_CLOSE_DELAY=-1
vanillabp:
  adapters:
    test:
      type: dummy
      test: 1
  outbox:
    poll-interval: PT0.2S
    attempt-frequency: PT0.2S
  cockpit:
    rest:
      base-url: http://localhost:1
  workflow-modules:
    test-module:
      adapters:
        test:
          resources-location: classpath:test-module/processes/dummy
      workflows:
        TestProcess:
          adapters:
            test:
              test: 2
