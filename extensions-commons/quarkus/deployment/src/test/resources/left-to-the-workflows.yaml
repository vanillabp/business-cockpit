quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:business-cockpit-left-to-the-workflows;DB_CLOSE_DELAY=-1
vanillabp:
  adapters:
    test:
      type: dummy
      test: 1
  outbox:
    poll-interval: PT0.2S
    attempt-frequency: PT0.2S
  cockpit:
    rest:
      base-url: http://localhost:1
  workflow-modules:
    test-module:
      adapters:
        test:
          resources-location: classpath:test-module/processes/dummy
      cockpit:
        workflow-module-uri: http://localhost:8081/test-module
        ui-uri-type: WEBPACK_MF_REACT
        ui-uri-path: /remoteEntry.js
      workflows:
        TestProcess:
          cockpit:
            i18n-languages:
              - fr
            bpmn-description-language: fr
