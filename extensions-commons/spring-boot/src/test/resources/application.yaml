spring:
  datasource:
    url: jdbc:h2:mem:business-cockpit-extension;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  adapters:
    test:
      type: dummy
      test: 1
  outbox:
    poll-interval: PT0.2S
    attempt-frequency: PT0.2S
  cockpit:
    rest:
      base-url: replaced-by-the-test
  workflow-modules:
    test-module:
      adapters:
        test:
          resources-location: classpath*:test-module/processes/dummy
      cockpit:
        workflow-module-uri: http://localhost:8081/test-module
        ui-uri-type: WEBPACK_MF_REACT
        ui-uri-path: /remoteEntry.js
        i18n-languages: en
        bpmn-description-language: en
        group-hierarchy:
          TEAM_LEAD: TEAM_MEMBER
test-module:
  nothing: there
